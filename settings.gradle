pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "mobile-lab-projects"

include ':practiceNotepadApp'
project(':practiceNotepadApp').projectDir = file('projects/mobile-app-practice/01-notepad/app')

include ':practiceHandlerApp'
project(':practiceHandlerApp').projectDir = file('projects/mobile-app-practice/02-handler-webview/app')

include ':practiceAnimationApp'
project(':practiceAnimationApp').projectDir = file('projects/mobile-app-practice/03-basic-animation/app')
